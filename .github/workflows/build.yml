name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compila APK (release, firmato)
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::$(grep -A10 'What went wrong' build.log | head -14 | tr '\n' '|')"
            echo "::error::$(tail -n 30 build.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Bussola-apk
          path: app/build/outputs/apk/release/*.apk
