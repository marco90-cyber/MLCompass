name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Serve per creare le release con il token del workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # versionCode crescente: ogni APK si installa sopra il precedente
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compila APK (release, firmato)
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::$(grep -A10 'What went wrong' build.log | head -14 | tr '\n' '|')"
            echo "::error::$(tail -n 30 build.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code

      - name: Pubblica la release
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "MLCompass-$TAG.apk"
          SUBJECT=$(git log -1 --pretty=%s)
          gh release create "$TAG" "MLCompass-$TAG.apk" \
            --title "MLCompass $TAG" \
            --notes "Ultima versione. Scarica **MLCompass-$TAG.apk** qui sotto e installalo sopra la precedente.

          Modifica: $SUBJECT" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Tieni solo le ultime 5 release
        run: |
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | while IFS= read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done
